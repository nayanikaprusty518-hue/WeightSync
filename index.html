<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeightSync Relational Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-gray-800 text-center">WeightSync Relational Dashboard</h1>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Upload New Item Data (Normalized Tables)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Weight Value</label>
                    <input type="number" step="0.01" id="weightInput" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-200">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Select Asset Image</label>
                    <input type="file" id="imageInput" accept="image/*" class="w-full mt-1 p-2 border rounded-md file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="button" id="submitBtn" onclick="handleCloudUpload()" class="w-full bg-blue-600 text-white p-2 rounded-md font-semibold hover:bg-blue-700 transition">Upload & Sync to Cloud</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Live Stored Relational Records</h2>
            <div id="recordsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <p class="text-gray-500 col-span-full text-center py-4">No records found in database. Upload an item to get started!</p>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://vlqjhlxcwtrwqgeuyrit.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_GY6gm31RuLclyTANowWTLw_9dAc0Fqe"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const submitBtn = document.getElementById('submitBtn');
        const recordsGrid = document.getElementById('recordsGrid');

        // Fetch records using an inner join linking 'weight_logs' and 'items'
        async function fetchRecords() {
            try {
                const { data, error } = await supabaseClient
                    .from('weight_logs')
                    .select(`
                        id,
                        weight,
                        item_id,
                        items (
                            image_url
                        )
                    `)
                    .order('id', { ascending: false });

                if (error) {
                    console.error("Fetch Error:", error);
                    return;
                }

                if (data && data.length > 0) {
                    recordsGrid.innerHTML = ''; 
                    data.forEach(log => {
                        const imageUrl = log.items ? log.items.image_url : 'https://via.placeholder.com/150';
                        
                        const card = document.createElement('div');
                        card.className = "bg-gray-50 border rounded-lg overflow-hidden shadow-sm flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <img src="${imageUrl}" alt="Cloud Asset" class="w-full h-48 object-cover bg-gray-200">
                                <div class="p-4">
                                    <p class="text-lg font-bold text-gray-800">Weight: <span class="text-blue-600">${log.weight}</span></p>
                                    <div class="text-xs text-gray-400 mt-2 space-y-1">
                                        <p>Log Record ID: ${log.id}</p>
                                        <p>Linked Item ID: ${log.item_id}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 pt-0">
                                <button onclick="deleteRecord(${log.item_id}, '${imageUrl}')" class="w-full bg-red-100 text-red-600 text-sm font-semibold py-1.5 px-3 rounded hover:bg-red-200 transition">
                                    Delete Asset
                                </button>
                            </div>
                        `;
                        recordsGrid.appendChild(card);
                    });
                } else {
                    recordsGrid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-4">No records found. Upload an item to map relational tables!</p>';
                }
            } catch (err) {
                console.error("Network binding error:", err);
            }
        }

        // Handle sequential Relational Database entries
        async function handleCloudUpload() {
            const weight = document.getElementById('weightInput').value;
            const imageInput = document.getElementById('imageInput');
            const imageFile = imageInput.files[0];
            
            if (!weight || !imageFile) {
                alert("Please fill out both the weight value and select an image file.");
                return;
            }

            submitBtn.innerText = "Processing Pipeline...";
            submitBtn.disabled = true;

            try {
                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const filePath = `uploads/${fileName}`;

                // STEP 1: Upload raw file to storage bucket
                const { error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(filePath, imageFile);

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(filePath);

                const publicImageUrl = urlData.publicUrl;

                // STEP 2: Insert image reference row into parent 'items' table
                const { data: itemRow, error: itemError } = await supabaseClient
                    .from('items')
                    .insert([{ image_url: publicImageUrl }])
                    .select();

                if (itemError) throw itemError;
                
                const newParentItemId = itemRow[0].id;

                // STEP 3: Insert weight log entry using relational Parent ID
                const { error: logError } = await supabaseClient
                    .from('weight_logs')
                    .insert([{ weight: parseFloat(weight), item_id: newParentItemId }]);

                if (logError) throw logError;

                alert(`Successfully split entries into separate tables!\nLinked to Item ID: ${newParentItemId}`);
                
                document.getElementById('weightInput').value = '';
                imageInput.value = '';
                
                fetchRecords(); 

            } catch (err) {
                console.error("Relational insert failed:", err);
                alert(`Error: ${err.message || err}`);
            } finally {
                submitBtn.innerText = "Upload & Sync to Cloud";
                submitBtn.disabled = false;
            }
        }

        // Complete Cascading Delete: Deletes Database Parent Row & Storage Bucket File
        async function deleteRecord(itemId, imageUrl) {
            if (!confirm("Are you sure you want to delete this waste log and its image from the cloud?")) return;

            try {
                // 1. Parse the filename out of the public URL to delete it from Storage
                const urlParts = imageUrl.split('/');
                const fileName = urlParts[urlParts.length - 1];
                const filePath = `uploads/${fileName}`;

                // 2. Remove file from Supabase Storage bucket
                await supabaseClient.storage.from('images').remove([filePath]);

                // 3. Delete parent row from 'items' table. 
                // Due to ON DELETE CASCADE, the child row in 'weight_logs' clears out instantly!
                const { error } = await supabaseClient
                    .from('items')
                    .delete()
                    .eq('id', itemId);

                if (error) throw error;

                alert("Record and cloud assets permanently deleted!");
                fetchRecords(); // Refresh layout dynamically

            } catch (err) {
                console.error("Delete sequence failed:", err);
                alert(`Delete Error: ${err.message || err}`);
            }
        }

        // Run on load
        fetchRecords();
    </script>
</body>
</html>
